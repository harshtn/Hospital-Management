{% extends 'base.html' %}

{% block title %}Confirm Delete Doctor{% endblock %}

{% block content %}
<div class="container-fluid px-0" style="max-width: 600px;">
    <div class="card border-0 shadow-sm rounded-4 mt-5">
        <div class="card-body p-4 text-center">
            <div class="stat-icon bg-danger-subtle text-danger mx-auto mb-3" style="width: 64px; height: 64px; font-size: 2rem;">
                <i class="bi bi-exclamation-triangle"></i>
            </div>
            <h4 class="fw-bold text-dark mb-2">Remove Physician Record?</h4>
            <p class="text-muted mb-4">
                Are you sure you want to delete <strong>Dr. {{ doctor.full_name }}</strong> (<code>{{ doctor.doctor_id }}</code>)?
            </p>
            <form method="POST">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-3">
                    <a href="{% url 'doctor_detail' doctor.pk %}" class="btn btn-outline-secondary px-4">Cancel</a>
                    <button type="submit" class="btn btn-danger px-4">Delete Doctor</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
